name: Finalize homepage

on:
  push:
    branches:
      - agent/homepage-markdown-first-upgrade

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homepage-markdown-first-upgrade
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: python .github/finalize_homepage.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm run docs:build
        env:
          NODE_OPTIONS: --max_old_space_size=8192
      - name: Commit verified changes
        run: |
          git config user.name "sharebravery"
          git config user.email "64069898+sharebravery@users.noreply.github.com"
          git rm .github/workflows/finalize-homepage.yml .github/finalize_homepage.py
          git add docs/.vuepress/config.ts docs/.vuepress/plugins/homeData.ts docs/.vuepress/layouts/Home.vue docs/.vuepress/public/favicon.svg docs/products/*.md
          git commit -m "refine homepage work states and favicon"
          git push origin HEAD:agent/homepage-markdown-first-upgrade
